name: Verify Marauders
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rules-and-multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
        working-directory: client
      - run: npm run lint && npm run build
        working-directory: client
      - run: dotnet build Marauders.slnx --configuration Release
      - run: dotnet test Marauders.slnx --configuration Release --no-build
      - run: dotnet publish server/Marauders.Server.csproj --configuration Release --output artifacts/publish
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:e2e
        working-directory: client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: client/test-results
          retention-days: 7
